/* each thing you log pays coins once */
function claimRewards(){
  var g=G(),first=!g.init,got=0;
  var give=function(k,n){if(g.claimed[k])return;g.claimed[k]=1;if(!first){g.coins+=n;got+=n;}};
  S.fitness.checkins.forEach(function(c){give('c:'+c.id,5)});
  S.books.forEach(function(b){if(b.status==='done')give('b:'+b.id,15)});
  S.shows.forEach(function(b){if(b.status==='done')give('s:'+b.id,8)});
  Object.keys(S.ru.days).forEach(function(d){var x=S.ru.days[d];['s','r','v'].forEach(function(t){if(x[t])give('r:'+d+':'+t,3)})});
  Object.keys(S.ru.done).forEach(function(id){give('t:'+id,1)});
  S.notes.forEach(function(n){give('n:'+n.id,5);if(n.status==='published')give('np:'+n.id,20);});
  if(first){g.init=1;save();return 0;}
  if(got)save();return got;
}

try{var so=JSON.parse(localStorage.getItem('lifelog-supa')||'null');if(so&&so.url)SUPA=so;}catch(e){}

function social(){
  if(!S.social.code){
    var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=new Uint8Array(37),c='',sec='';crypto.getRandomValues(r);
    for(var i=0;i<5;i++)c+=A[r[i]%A.length];
    for(var j=5;j<37;j++)sec+=('0'+r[j].toString(16)).slice(-2);
    S.social={code:'LL-'+c,secret:sec};save();
  }
  return S.social;
}
function me(extra){var s=social();return Object.assign({p_code:s.code,p_secret:s.secret},extra||{});}
function rpc(fn,args){
  var h={'Content-Type':'application/json',apikey:SUPA.key};
  if(/^eyJ/.test(SUPA.key))h.Authorization='Bearer '+SUPA.key;
  return fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)}).then(function(r){
    return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null}catch(e){}
      if(!r.ok)throw new Error((d&&d.message)||('error '+r.status));return d;});
  });
}
function pushPet(){
  var ps=PS||petStats();
  return rpc('save_pet',me({p_pet:{name:S.pet.name||'pet',species:S.pet.species||'bunny',color:S.pet.color||'white',home:{roof:S.pet.roof||'pink',books:ps.books,booksYear:ps.booksYear,films:ps.films,flowers:ps.flowers,wear:G().wear,furn:G().furn},stage:ps.stage,level:ps.level,xp:ps.xp,stats:ps.v,mood:ps.avg>=70?'happy':(ps.sad?'sad':'ok')}}));
}
function syncFriends(force){
  if(!SUPA.url||FR.busy||!PS)return;
  var now=Date.now();if(!force&&PS.xp===FR.xp&&now-FR.at<45000)return;
  FR.busy=true;FR.at=now;FR.xp=PS.xp;
  pushPet().then(function(){return rpc('get_friends',me())})
  .then(function(l){FR.list=l||[];FR.err='';liveSync();return rpc('get_gifts',me())})
  .then(function(g){g=g||[];if(!g.length)return;
    var kept=[];try{kept=JSON.parse(localStorage.getItem('lifelog-gifts')||'[]')}catch(e){}
    g.forEach(function(x){kept.push({k:x.kind,n:x.name,t:Date.now()})});
    kept=kept.filter(function(x){return Date.now()-x.t<3*864e5}).slice(-8);
    try{localStorage.setItem('lifelog-gifts',JSON.stringify(kept))}catch(e){}
    P.happyUntil=Date.now()+4000;burst(8);
    var x=g[g.length-1];
    say(g.length>1?'you got '+g.length+' gifts from friends! ♥':(x.name||'a friend')+' sent you '+GIFTS[x.kind].a+'! ♥',7000);
  })
  .catch(function(e){FR.err=String(e.message||e)})
  .then(function(){FR.busy=false;paintFriends();});
}
function giftItems(){var k=[];try{k=JSON.parse(localStorage.getItem('lifelog-gifts')||'[]')}catch(e){}return k.filter(function(x){return Date.now()-x.t<3*864e5});}
function ago(ts){
  if(!ts)return '';var d=new Date(ts);d.setHours(0,0,0,0);var n=new Date();n.setHours(0,0,0,0);
  var days=Math.round((n-d)/864e5);return days<=0?'active today':days===1?'active yesterday':'active '+days+' days ago';
}

    return '<div class="friend"><div class="fpic">'+petSvg(kind,st,f.color,f.species,(f.home||{}).wear)+'</div><div class="fi">'+
      '<div class="row" style="justify-content:space-between"><b>'+esc(f.name||'pet')+'</b><span class="lbl">lv '+(f.level|0)+' · '+STAGES[st].name+' '+(SPECIES[f.species]||SPECIES.bunny).name+'</span></div>'+
      '<div class="fbars">'+bars+'</div><div class="lbl">'+(isLive(f.code)?'<span class="online">● here now · '+locName(P.live[f.code].p.loc,f)+'</span>':ago(f.updated_at))+'</div>'+
      '<div class="fgifts">'+['heart','carrot','flower'].map(function(k){return '<button data-act="gift" data-k="'+k+'" data-id="'+esc(f.code)+'" aria-label="send '+GIFTS[k].a+'">'+pxIcon(GIFTS[k].g.map(function(r){return r.replace(/[^.]/g,'r')}),k==='heart'?'#FF7AA8':k==='carrot'?'#FF9F43':'#C9A7EB')+'</button>'}).join('')+
      (isLive(f.code)?'<button data-act="join" data-id="'+esc(f.code)+'">go to her ♥</button>':'<button data-act="invite" data-id="'+esc(f.code)+'">invite over</button>')+'<button data-act="visit" data-id="'+esc(f.code)+'">visit her house</button></div>'+
      '<button class="link lbl" data-act="unfriend" data-id="'+esc(f.code)+'" style="margin-top:6px;padding:0">remove</button>'+
    '</div></div>';
  }).join('');

function paintFriends(){var el=$('#friends');if(el)el.innerHTML=friendsInner();}

/* ---------- live: see your friend move when you're in the same place ---------- */
var LIVE={client:null,chans:{},loading:false,sendT:0,last:'',idle:0};
function isLive(code){var l=P.live[code];return !!(l&&Date.now()-l.t<9000);}
function myLoc(){var me2=social().code,s=P.scene;return s==='garden'?'garden':s==='out'?'out:'+me2:s==='in'?'in:'+me2:s==='visit'?'out:'+P.visit.code:'in:'+P.visit.code;}
function locName(loc,f){var me2=social().code;return loc==='garden'?'in the garden':loc==='out:'+me2||loc==='in:'+me2?'at your house!':loc==='out:'+f.code||loc==='in:'+f.code?'at her house':'visiting a friend';}
function joinFriend(code){
  var l=P.live[code];if(!l)return;var loc=l.p.loc,me2=social().code;window.scrollTo({top:0,behavior:'smooth'});
  if(loc==='garden')return go('garden');
  if(loc==='out:'+me2)return go('out');if(loc==='in:'+me2)return go('in');
  var other=friendBy(loc.split(':')[1]);if(!other)return say('she\'s visiting someone you don\'t know yet',3000);
  P.visit=other;var to=loc.indexOf('in:')===0?'visitIn':'visit';if(P.scene===to)enterScene(to);else go(to);
}
function liveStart(){
  if(!SUPA.url||LIVE.client)return;
  if(!window.supabase){if(LIVE.loading)return;LIVE.loading=true;var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';sc.onload=function(){LIVE.loading=false;liveStart();};sc.onerror=function(){LIVE.loading=false;};document.head.appendChild(sc);return;}
  try{LIVE.client=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:8}}});}catch(e){return;}
  liveSync();
}
function liveSync(){
  if(!LIVE.client){liveStart();return;}
  var mine=social().code;
  (FR.list||[]).forEach(function(f){
    var name='ll-'+[mine,f.code].sort().join('-');if(LIVE.chans[name])return;
    var ch=LIVE.client.channel(name,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'p'},function(m){var p=m.payload||{};if(!p.c||p.c===mine)return;var was=isLive(p.c),l=P.live[p.c]||(P.live[p.c]={});
        var moved=l.p&&l.p.loc!==p.loc;l.p=p;l.t=Date.now();if(moved||l.x==null)l.x=p.x;
        if(!was||moved){paintFriends();P.npcs=sceneNpcs(P.scene);var fr=friendBy(p.c);if(fr&&p.loc===myLoc())say((fr.name||'your friend')+' is here! ♥',4000);}})
      .on('broadcast',{event:'e'},function(m){var p=m.payload||{},l=P.live[p.c];if(l&&l.p.loc===myLoc())burst(4,l.x);})
      .subscribe();
    LIVE.chans[name]=ch;
  });
}
function liveSend(ev,payload){for(var k in LIVE.chans){try{LIVE.chans[k].send({type:'broadcast',event:ev,payload:payload})}catch(e){}}}
function liveTick(dt){
  Object.keys(P.live).forEach(function(c){if(!isLive(c)&&P.live[c].shown){P.live[c].shown=0;paintFriends();P.npcs=sceneNpcs(P.scene);}else if(isLive(c))P.live[c].shown=1;});
  if(!LIVE.client||!Object.keys(LIVE.chans).length)return;
  var mvNow=Math.abs(P.tx-P.x)>.5||P.jump>0;if(mvNow&&!LIVE.mv)LIVE.sendT=0;LIVE.mv=mvNow;
  LIVE.sendT-=dt;if(LIVE.sendT>0)return;
  var ps=PS||{},now=Date.now(),moving=mvNow,sleeping=isNight()&&now>P.awakeUntil;
  var p={c:social().code,n:S.pet.name||'pet',sp:S.pet.species,col:S.pet.color,st:ps.stage|0,wear:G().wear,loc:myLoc(),x:Math.round(P.x),mv:moving?1:0,k:sleeping?'sleep':now<P.happyUntil?'happy':ps.sad?'sad':'idle'};
  var sig=JSON.stringify(p);LIVE.sendT=moving?.2:2;
  if(sig===LIVE.last&&LIVE.idle>0){LIVE.idle--;return;}
  LIVE.last=sig;LIVE.idle=2;liveSend('p',p);
}
function shareCode(){
  var c=social().code,url=location.href.split('#')[0],text='be my friend on life log ♥ my code is '+c;
  if(navigator.share){navigator.share({text:text,url:url}).catch(function(){});return;}
  if(navigator.clipboard)navigator.clipboard.writeText(text+' '+url).then(function(){say('code copied! send it to a friend ♥',4000)}).catch(function(){say('your code is '+c,6000)});
  else say('your code is '+c,6000);
}

/* fitness */
function rFitness(){
  var f=S.fitness, ci=f.checkins.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var wkAgo=new Date();wkAgo.setDate(wkAgo.getDate()-6);var wk=dkey(wkAgo),mo=today().slice(0,7);
  var nW=ci.filter(function(c){return c.date>=wk}).length,nM=ci.filter(function(c){return c.date.slice(0,7)===mo}).length;
  var lastW=ci.filter(function(c){return c.weight}); var cur=lastW.length?lastW[0].weight:f.weight;
  var h='<section class="card"><div class="card-h"><h2>me</h2><button class="link" data-act="editMe">edit</button></div>'+
  '<div class="stats" style="margin-bottom:10px"><div><span class="lbl">height</span><b>'+(esc(f.height)||'—')+'</b></div><div><span class="lbl">weight now</span><b>'+(esc(cur)||'—')+'</b></div><div><span class="lbl">goal</span><b>'+(esc(f.goalWeight)||'—')+'</b></div></div>'+
  (f.goals?'<div class="lbl">goals</div><div class="pre">'+esc(f.goals)+'</div>':'<div class="muted">tap edit to add height, weight and goals</div>')+'</section>';
  h+='<button class="primary big" data-act="checkin">+ check in</button><div style="height:14px"></div>';
  h+='<div class="stats"><div><span class="lbl">last 7 days</span><b>'+nW+'</b></div><div><span class="lbl">this month</span><b>'+nM+'</b></div><div><span class="lbl">total</span><b>'+ci.length+'</b></div></div>';
  var pts=f.checkins.filter(function(c){return c.weight&&!isNaN(parseFloat(String(c.weight).replace(',','.')))}).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(pts.length>=2) h+='<section class="card"><h2>weight</h2>'+chart(pts)+'</section>';
  h+='<section class="card"><div class="card-h"><h2>training plan</h2><button class="link" data-act="addPlan">+ add</button></div>'+
  (f.plan.length?'<div class="list">'+f.plan.map(function(p){return '<div class="item" data-act="editPlan" data-id="'+p.id+'"><h3>'+esc(p.name)+'</h3><div class="pre">'+esc(p.items)+'</div></div>'}).join('')+'</div>':'<div class="empty">no workouts yet.<br>add your training here (A, B, legs day…)</div>')+'</section>';
  h+='<section class="card"><h2>check-ins</h2>'+(ci.length?'<div class="list">'+ci.map(function(c){return '<div class="item" data-act="editCheckin" data-id="'+c.id+'"><div class="row" style="justify-content:space-between"><span class="lbl">'+fmt(c.date)+'</span>'+(c.weight?'<span class="tag">'+esc(c.weight)+'</span>':'')+'</div><h3>'+(esc(c.workout)||'workout')+'</h3>'+(c.did?'<div class="pre">'+esc(c.did)+'</div>':'')+(c.notes?'<div class="pre muted">'+esc(c.notes)+'</div>':'')+'</div>'}).join('')+'</div>':'<div class="empty">no check-ins yet</div>')+'</section>';
  return h;
}
function chart(pts){
  var v=pts.map(function(p){return parseFloat(String(p.weight).replace(',','.'))});
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);if(mx===mn){mx+=1;mn-=1;}
  var W=320,H=120,P=22;
  var xy=v.map(function(y,i){return[P+(W-2*P)*i/(v.length-1),P/2+(H-P*1.5)*(1-(y-mn)/(mx-mn))]});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><polyline fill="none" stroke="#E86A9A" stroke-width="2" stroke-linejoin="round" points="'+xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'+xy.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#4A2B4F"/>'}).join('')+
  '<text x="'+P+'" y="'+(H-2)+'" font-size="12">'+fmt(pts[0].date)+'</text><text x="'+(W-P)+'" y="'+(H-2)+'" font-size="15" text-anchor="end">'+fmt(pts[pts.length-1].date)+'</text><text x="2" y="14" font-size="12">'+mx+'</text></svg>';
}

function rMedia(t){
  var M=MEDIA[t],arr=S[M.key],cur=UI[t],yr=String(new Date().getFullYear());
  var doneY=arr.filter(function(x){return x.status==='done'&&(x.finish||'').slice(0,4)===yr}).length,g=S.goals[M.goal];
  var h='<div class="card"><div class="row" style="justify-content:space-between"><div><span class="lbl">'+M.verb+' in '+yr+' · just for fun</span><h2>'+doneY+' / '+g+'</h2></div><button class="link" data-act="goal" data-t="'+t+'">change goal</button></div><div class="bar"><i style="width:'+Math.min(100,doneY/g*100)+'%"></i></div></div>';
  h+='<div class="seg">'+M.st.map(function(s){var n=arr.filter(function(x){return x.status===s[0]}).length;return '<button data-act="seg" data-t="'+t+'" data-v="'+s[0]+'" class="'+(s[0]===cur?'on':'')+'">'+s[1]+' · '+n+'</button>'}).join('')+'</div>';
  h+='<button class="primary big" data-act="addMedia" data-t="'+t+'">+ add '+M.noun+'</button><div style="height:14px"></div>';
  var list=arr.filter(function(x){return x.status===cur});
  if(cur==='done') list.sort(function(a,b){return (b.finish||'').localeCompare(a.finish||'')});
  if(!list.length) return h+'<div class="empty">nothing here yet</div>';
  h+='<div class="grid2">'+list.map(function(x){
    var sub=t==='reading'?x.author:[x.kind,x.where].filter(Boolean).join(' · ');
    return '<div class="media" data-act="editMedia" data-t="'+t+'" data-id="'+x.id+'"><div class="cover">'+(x.cover?'<img src="'+esc(x.cover)+'" alt="">':'<span>'+esc(x.title)+'</span>')+'</div><div class="t">'+esc(x.title)+'</div>'+(sub?'<div class="muted" style="font-size:15px">'+esc(sub)+'</div>':'')+
    (x.status==='done'?'<div>'+stars(x.rating)+'</div>'+(x.finish?'<div class="lbl">'+fmt(x.finish)+'</div>':''):'')+
    (x.status!=='done'?'<button class="link" style="font-size:15px" data-act="finishMedia" data-t="'+t+'" data-id="'+x.id+'">'+(t==='reading'?'finished it →':'watched it →')+'</button>':'')+'</div>';
  }).join('')+'</div>';

function rSubstack(){
  var q=(UI.q||'').toLowerCase();
  var list=S.notes.filter(function(n){return (UI.nf==='all'||n.status===UI.nf)&&(!q||(n.title+' '+n.body+' '+n.tags+' '+n.links).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.updated-a.updated});
  var h='<div class="card"><span class="lbl">afterimage</span><h2>essay ideas & references</h2></div>';
  h+='<input id="nq" placeholder="search notes…" value="'+esc(UI.q)+'" style="margin-bottom:10px">';
  h+='<div class="chips">'+[['all','all']].concat(NST).map(function(s){return '<button data-act="nf" data-v="'+s[0]+'" class="'+(UI.nf===s[0]?'on':'')+'">'+s[1]+'</button>'}).join('')+'</div>';
  h+='<button class="primary big" data-act="addNote">+ new note</button><div style="height:14px"></div>';
  if(!list.length) return h+'<div class="empty">no notes yet</div>';
  return h+list.map(function(n){
    var links=parseLinks(n.links);
    return '<section class="card" data-act="editNote" data-id="'+n.id+'" style="cursor:pointer"><div class="row" style="justify-content:space-between"><h3>'+(esc(n.title)||'untitled')+'</h3><span class="tag '+(n.status==='published'?'fill':'')+'">'+esc(n.status)+'</span></div>'+
    (n.body?'<div class="pre" style="max-height:5.2em;overflow:hidden">'+esc(n.body)+'</div>':'')+
    (links.length?'<div>'+links.map(function(l){return '<a class="lnk" href="'+esc(l.url)+'" target="_blank" rel="noopener">↗ '+esc(l.label)+'</a>'}).join('')+'</div>':'')+
    (n.tags?'<div style="margin-top:6px">'+n.tags.split(',').map(function(x){x=x.trim();return x?'<span class="tag">'+esc(x)+'</span>':''}).join('')+'</div>':'')+'</section>';
  }).join('');
}
function parseLinks(s){
  return String(s||'').split('\n').map(function(l){l=l.trim();if(!l)return null;var p=l.split('|');var url=(p.length>1?p[1]:p[0]).trim(),label=(p.length>1?p[0]:p[0]).trim();
    if(!/^https?:\/\//i.test(url)){ if(/^[\w.-]+\.[a-z]{2,}/i.test(url)) url='https://'+url; else return {url:'#',label:label,bad:1}; }
    if(p.length<2) label=label.replace(/^https?:\/\/(www\.)?/i,'').slice(0,40);
    return {url:url,label:label};}).filter(function(x){return x&&!x.bad});
}

/* russian */
function dayLv(k){var d=S.ru.days[k];if(!d)return 0;return (d.s?1:0)+(d.r?1:0)+(d.v?1:0);}
function streak(){var d=new Date(),n=0;if(!dayLv(dkey(d)))d.setDate(d.getDate()-1);while(dayLv(dkey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function rRussian(){
  var k=today(),td=S.ru.days[k]||{},mo=k.slice(0,7);
  var monthN=Object.keys(S.ru.days).filter(function(x){return x.slice(0,7)===mo&&dayLv(x)}).length;
  var h='<section class="card"><span class="lbl">today · '+fmt(k)+'</span><h2 style="margin-bottom:10px">сегодня я…</h2><div class="toggles">'+
    [['s','studied'],['r','read a text'],['v','watched a video']].map(function(x){return '<button data-act="ruT" data-k="'+x[0]+'" class="'+(td[x[0]]?'on':'')+'">'+(td[x[0]]?'✓ ':'')+x[1]+'</button>'}).join('')+'</div></section>';
  h+='<div class="stats"><div><span class="lbl">streak</span><b>'+streak()+'</b></div><div><span class="lbl">days this month</span><b>'+monthN+'</b></div><div><span class="lbl">topics learned</span><b>'+TOPICS.filter(function(t){return S.ru.done[t.id]}).length+'</b></div></div>';
  // calendar
  var y=UI.cy,m=UI.cm,first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var c='<section class="card"><div class="card-h"><button class="link" data-act="cal" data-d="-1">←</button><h2>'+MONTHS[m]+' '+y+'</h2><button class="link" data-act="cal" data-d="1">→</button></div><div class="cal">'+['m','t','w','t','f','s','s'].map(function(x){return '<div class="dow">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)c+='<div></div>';
  for(var dd=1;dd<=days;dd++){var key=y+'-'+pad(m+1)+'-'+pad(dd);c+='<button data-act="ruDay" data-d="'+key+'" class="l'+dayLv(key)+(key===k?' tod':'')+'">'+dd+'</button>';}
  h+=c+'</div><div class="lbl" style="margin-top:8px">darker = more done that day · tap a day to edit</div></section>';
  // topics
  var all=TOPICS.length,dn=TOPICS.filter(function(t){return S.ru.done[t.id]}).length;
  var a1=TOPICS.filter(function(t){return!t.a2}),a2=TOPICS.filter(function(t){return t.a2});
  var pc=function(a){var n=a.filter(function(t){return S.ru.done[t.id]}).length;return [n,a.length]};
  var p1=pc(a1),p2=pc(a2);
  h+='<section class="card"><h2>topics · A1 → A2</h2><div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">A1</span><span class="lbl">'+p1[0]+' / '+p1[1]+'</span></div><div class="bar"><i style="width:'+(p1[0]/p1[1]*100)+'%"></i></div>'+
   '<div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">A2</span><span class="lbl">'+p2[0]+' / '+p2[1]+'</span></div><div class="bar"><i style="width:'+(p2[0]/p2[1]*100)+'%"></i></div>'+
   '<div class="lbl" style="margin-top:4px">total '+dn+' / '+all+'</div></section>';
  h+='<div class="chips">'+[['all','all'],['a1','A1'],['a2','A2'],['todo','to learn']].map(function(x){return '<button data-act="rf" data-v="'+x[0]+'" class="'+(UI.rf===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  var show=function(t){return UI.rf==='all'||(UI.rf==='a1'&&!t.a2)||(UI.rf==='a2'&&t.a2)||(UI.rf==='todo'&&!S.ru.done[t.id])};
  RU.forEach(function(cat){
    var gh='';
    cat[1].forEach(function(gr){
      var items=gr.items.filter(show);if(!items.length)return;
      var n=gr.items.filter(function(t){return S.ru.done[t.id]}).length;
      gh+='<details class="grp" data-g="'+gr.gi+'"'+(UI.open[gr.gi]?' open':'')+'><summary><h3>'+esc(gr[0])+'</h3><span class="n">'+(n===gr.items.length?'✓ ':'')+n+' / '+gr.items.length+'</span></summary>'+
      items.map(function(t){var d=!!S.ru.done[t.id];return '<label class="topic'+(d?' done':'')+'"><input type="checkbox" data-topic="'+t.id+'"'+(d?' checked':'')+'><span>'+esc(t.t)+'</span>'+(t.a2?'<span class="tag">A2</span>':'')+'</label>'}).join('')+'<div style="height:8px"></div></details>';
    });
    if(gh) h+='<div class="cat"><span class="lbl">'+esc(cat[0])+'</span></div><section class="card" style="padding-top:2px;padding-bottom:2px">'+gh+'</section>';
  });
  return h;
}

/* ---------- modal ---------- */
var MSAVE=null,MDEL=null,delArm=false;
function modal(title,body,onSave,onDel,noSave){
  MSAVE=onSave;MDEL=onDel;delArm=false;MODAL=true;
  var m=$('#modal');
  m.innerHTML='<div class="sheet"><div class="sheet-h"><h2>'+esc(title)+'</h2><button type="button" class="x" data-m="close">×</button></div><form id="mf" autocomplete="off">'+body+'<div class="sheet-f">'+(onDel?'<button type="button" class="danger" data-m="del">delete</button>':'')+'<span style="flex:1"></span><button type="button" data-m="close">'+(noSave?'close':'cancel')+'</button>'+(noSave?'':'<button class="primary" type="submit">save</button>')+'</div></form></div>';
  m.hidden=false;document.body.style.overflow='hidden';
}
function closeModal(){var m=$('#modal');m.hidden=true;m.innerHTML='';MODAL=false;document.body.style.overflow='';if(dirty)schedule();}
var fld=function(label,inner){return '<div class="f"><span class="lbl">'+label+'</span>'+inner+'</div>'};
var inp=function(name,val,type,ph){return '<input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'};
var ta=function(name,val,ph,rows){return '<textarea name="'+name+'"'+(rows?' rows="'+rows+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>'};
var sel=function(name,val,opts){return '<select name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'};
var starIn=function(v){v=+v||0;var s='<input type="hidden" name="rating" value="'+v+'"><div class="starsin">';for(var i=1;i<=5;i++)s+='<button type="button" data-star="'+i+'" class="'+(i<=v?'on':'')+'">★</button>';return s+'</div>'};
function fv(name){var e=$('#mf [name="'+name+'"]');return e?e.value.trim():''}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function remove(arr,id){var i=arr.findIndex(function(x){return x.id===id});if(i>-1)arr.splice(i,1)}

function editMe(){
  var f=S.fitness;
  modal('me',fld('height',inp('height',f.height,'text','e.g. 1,65 m'))+fld('starting weight',inp('weight',f.weight,'text','e.g. 60 kg'))+fld('goal weight',inp('goalWeight',f.goalWeight,'text','optional'))+fld('my goals',ta('goals',f.goals,'what do you want from training?',4)),
  function(){f.height=fv('height');f.weight=fv('weight');f.goalWeight=fv('goalWeight');f.goals=fv('goals');save();});
}
function editPlan(id){
  var p=id?byId(S.fitness.plan,id):null;
  modal(p?'edit workout':'new workout',fld('name',inp('name',p?p.name:'','text','e.g. workout A — upper body'))+fld('exercises (one per line)',ta('items',p?p.items:'','squats 4x10\nleg press 3x12…',8)),
  function(){var n=fv('name');if(!n)return false;if(p){p.name=n;p.items=fv('items')}else S.fitness.plan.push({id:uid(),name:n,items:fv('items')});save();},
  p?function(){remove(S.fitness.plan,id);save();}:null);
}
function editCheckin(id){
  var c=id?byId(S.fitness.checkins,id):null;
  var opts=[['','—']].concat(S.fitness.plan.map(function(p){return[p.name,p.name]}));
  var w=c?c.workout:'';if(w&&!opts.some(function(o){return o[0]===w}))opts.push([w,w]);
  opts.push(['other','other / cardio / class']);
  modal(c?'edit check-in':'check in',fld('date',inp('date',c?c.date:today(),'date'))+fld('workout',sel('workout',w,opts))+fld('what i did',ta('did',c?c.did:'','exercises, loads, km, minutes…',5))+fld('weight today (optional)',inp('weight',c?c.weight:'','text','e.g. 59,5'))+fld('notes',ta('notes',c?c.notes:'','how did it feel?',2)),
  function(){var o={date:fv('date')||today(),workout:fv('workout'),did:fv('did'),weight:fv('weight'),notes:fv('notes')};if(c)Object.assign(c,o);else{o.id=uid();S.fitness.checkins.push(o);}save();},
  c?function(){remove(S.fitness.checkins,id);save();}:null);
}
var pendingCover=null;
function editMedia(t,id,forceDone){
  var M=MEDIA[t],x=id?byId(S[M.key],id):null;pendingCover=x?x.cover:'';
  var st=forceDone?'done':(x?x.status:UI[t]);
  var b='<div class="f"><span class="lbl">cover (optional)</span><div id="cvp">'+(pendingCover?'<img class="prev" src="'+esc(pendingCover)+'">':'')+'</div><div class="row"><input type="file" accept="image/*" id="cvf" style="border:0;padding:4px 0">'+(pendingCover?'<button type="button" class="link" data-m="nocover">remove</button>':'')+'</div></div>'+
   fld('title',inp('title',x?x.title:''));
  if(t==='reading') b+=fld('author',inp('author',x?x.author:''));
  else b+=fld('type',sel('kind',x?x.kind:'film',[['film','film'],['series','series'],['doc','documentary'],['other','other']]))+fld('where (optional)',inp('where',x?x.where:'','text','mubi, netflix, cinema…'));
  b+=fld('status',sel('status',st,M.st));
  b+='<div id="donef"'+(st==='done'?'':' hidden')+'>'+fld('finished on',inp('finish',x&&x.finish?x.finish:today(),'date'))+fld('rating',starIn(x?x.rating:0))+fld('review',ta('review',x?x.review:'','what stayed with you?',4))+'</div>';
  modal(x?'edit':'add '+M.noun,b,function(){
    var ti=fv('title');if(!ti)return false;
    var o={title:ti,status:fv('status'),cover:pendingCover||''};
    if(t==='reading')o.author=fv('author');else{o.kind=fv('kind');o.where=fv('where');}
    if(o.status==='done'){o.finish=fv('finish')||today();o.rating=+fv('rating')||0;o.review=fv('review');}
    if(x)Object.assign(x,o);else{o.id=uid();o.added=today();S[M.key].push(o);}
    UI[t]=o.status;keepUI();save();
  },x?function(){remove(S[M.key],id);save();}:null);
  $('#cvf').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;$('#cvp').innerHTML='<div class="lbl">uploading…</div>';
    processImage(file).then(function(u){pendingCover=u;$('#cvp').innerHTML='<img class="prev" src="'+esc(u)+'">'}).catch(function(){$('#cvp').innerHTML='<div class="lbl">couldn\'t read that image</div>'})});
  $('#mf [name=status]').addEventListener('change',function(e){$('#donef').hidden=e.target.value!=='done'});
}
function editNote(id){
  var n=id?byId(S.notes,id):null;
  modal(n?'edit note':'new note',fld('title',inp('title',n?n.title:'','text','essay idea'))+fld('status',sel('status',n?n.status:'idea',NST))+fld('notes',ta('body',n?n.body:'','thoughts, quotes, structure…',9))+fld('links & references — one per line (label | url)',ta('links',n?n.links:'','the review i liked | https://…',4))+fld('tags (comma separated)',inp('tags',n?n.tags:'','film, books, art…')),
  function(){var o={title:fv('title'),status:fv('status'),body:fv('body'),links:fv('links'),tags:fv('tags'),updated:Date.now()};if(!o.title&&!o.body)return false;if(n)Object.assign(n,o);else{o.id=uid();o.created=Date.now();S.notes.push(o);}save();},
  n?function(){remove(S.notes,id);save();}:null);
}
function editDay(k){
  var d=S.ru.days[k]||{};
  modal(fmt(k),[['s','studied'],['r','read a text'],['v','watched a video']].map(function(x){return '<label class="chk"><input type="checkbox" name="'+x[0]+'"'+(d[x[0]]?' checked':'')+'><span>'+x[1]+'</span></label>'}).join('')+fld('note (optional)',ta('note',d.note||'','what did you study?',3)),
  function(){var o={s:$('#mf [name=s]').checked,r:$('#mf [name=r]').checked,v:$('#mf [name=v]').checked,note:fv('note')};if(!o.s&&!o.r&&!o.v&&!o.note)delete S.ru.days[k];else S.ru.days[k]=o;save();});
}
function editGoal(t){
  var M=MEDIA[t];
  modal('goal for this year',fld(M.key==='books'?'books':'movies & shows',inp('g',S.goals[M.goal],'number')),function(){var g=parseInt(fv('g'),10);if(g>0){S.goals[M.goal]=g;save();}});

/* ---------- backup ---------- */
var LB='lifelog-lastbackup';
function summary(o){
  var f=o.fitness||{},n=function(a){return (a||[]).length},ru=o.ru||{};
  var parts=[[n(f.checkins),'check-in','check-ins'],[n(f.plan),'workout','workouts'],[n(o.books),'book','books'],[n(o.shows),'film or show','films & shows'],[n(o.notes),'note','notes'],[Object.keys(ru.days||{}).length,'russian day','russian days'],[Object.keys(ru.done||{}).length,'topic','topics']];
  return parts.map(function(p){return p[0]+' '+(p[0]===1?p[1]:p[2])}).join(' · ');
}
function settingsSheet(){
  var last=null;try{last=localStorage.getItem(LB)}catch(e){}
  modal('settings',
    '<h3>tabs</h3><p class="muted" style="margin:2px 0 8px">Hide what you don\'t use. Your pet won\'t miss it, and nothing is deleted.</p>'+
    TABS.filter(function(t){return t[0]!=='home'}).map(function(t){return '<label class="chk"><input type="checkbox" data-tabtoggle="'+t[0]+'"'+(shown(t[0])?' checked':'')+'><span>'+t[1]+'</span></label>'}).join('')+
    '<h3 style="margin-top:18px">backup</h3>'+
    '<p style="margin:0 0 12px">Everything is saved in this browser only. Download a backup now and then, and use it to move your data to another device.</p>'+
    '<div class="f"><span class="lbl">on this device</span><div>'+summary(S)+'</div></div>'+
    '<div class="f"><span class="lbl">last backup</span><div>'+(last?fmt(last):'never')+'</div></div>'+
    '<button type="button" class="primary big" data-act="export">download backup</button><div style="height:10px"></div>'+
    '<label class="big" style="display:block;text-align:center;border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);padding:10px;font-weight:600;font-size:20px;cursor:pointer">load a backup<input type="file" id="impf" accept="application/json,.json" hidden></label>',
    null,null,true);
  $('#impf').addEventListener('change',function(e){var file=e.target.files[0];if(file)readBackup(file);});
}
function exportData(){
  var name='lifelog-'+today()+'.json',json=JSON.stringify(S,null,2);
  var done=function(){try{localStorage.setItem(LB,today())}catch(e){}closeModal();render();};
  var file=null;try{file=new File([json],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){
    navigator.share({files:[file],title:name}).then(done).catch(function(){});return;
  }
  var url=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
  done();
}
function readBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result)}catch(e){o=null}
    if(!o||typeof o!=='object'||!('fitness' in o||'books' in o||'ru' in o)){alert("That file isn't a life log backup.");return;}
    var when=o.updated?fmt(dkey(new Date(o.updated))):'unknown date';
    closeModal();
    modal('load backup?',
      '<div class="f"><span class="lbl">backup from '+esc(when)+'</span><div>'+summary(o)+'</div></div>'+
      '<div class="f"><span class="lbl">on this device now</span><div>'+summary(S)+'</div></div>'+
      '<p style="margin:0">This replaces everything on this device with the backup. Download a backup first if you want to keep what\'s here.</p>',
      function(){S=norm(o);save();});
    var b=$('#mf [type=submit]');if(b)b.textContent='replace';
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){var a=m.getAttribute('data-m');
    if(a==='close'){closeModal();render();return;}
    if(a==='del'){if(!delArm){delArm=true;m.textContent='tap again to delete';return;}var f=MDEL;closeModal();if(f)f();render();return;}
    if(a==='nocover'){pendingCover='';$('#cvp').innerHTML='';m.remove();return;}
  }
  var st=e.target.closest('[data-star]');
  if(st){var v=+st.getAttribute('data-star'),hid=$('#mf [name=rating]');if(+hid.value===v)v=0;hid.value=v;document.querySelectorAll('[data-star]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-star')<=v)});return;}
  if(e.target.id==='modal'){closeModal();render();return;}
  if(e.target.closest('a.lnk')){e.stopPropagation();return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),t=el.getAttribute('data-t');
  switch(act){
    case 'editMe':editMe();break;
    case 'checkin':editCheckin();break;
    case 'editCheckin':editCheckin(id);break;
    case 'addPlan':editPlan();break;
    case 'editPlan':editPlan(id);break;
    case 'seg':UI[t]=el.getAttribute('data-v');keepUI();render();break;
    case 'addMedia':editMedia(t);break;
    case 'editMedia':editMedia(t,id);break;
    case 'finishMedia':e.stopPropagation();editMedia(t,id,true);break;
    case 'goal':editGoal(t);break;
    case 'nf':UI.nf=el.getAttribute('data-v');keepUI();render();break;
    case 'addNote':editNote();break;
    case 'editNote':editNote(id);break;
    case 'ruT':var k=today(),d=S.ru.days[k]||(S.ru.days[k]={}),kk=el.getAttribute('data-k');d[kk]=!d[kk];save();render();break;
    case 'ruDay':editDay(el.getAttribute('data-d'));break;
    case 'cal':UI.cm+=+el.getAttribute('data-d');if(UI.cm<0){UI.cm=11;UI.cy--;}if(UI.cm>11){UI.cm=0;UI.cy++;}keepUI();render();break;
    case 'settings':settingsSheet();break;
    case 'export':exportData();break;
    case 'pet-l':case 'pet-r':case 'pet-u':case 'pet-d':case 'pet-a':case 'pet-b':petAct(act);break;
    case 'petName':nameModal();break;
    case 'shop':shopSheet();break;
    case 'shelfItem':closeModal();editMedia(t,id);break;
    case 'shelfAdd':closeModal();editMedia(t);break;
    case 'buy':buy(el.getAttribute('data-k'));break;
    case 'wear':wear(el.getAttribute('data-k'));break;
    case 'join':joinFriend(id);break;
    case 'addFriend':addFriendModal();break;
    case 'shareCode':shareCode();break;
    case 'gift':sendGift(id,el.getAttribute('data-k'));break;
    case 'invite':invite(id);break;
    case 'visit':visit(id);break;
    case 'scene':go(el.getAttribute('data-s'));break;
    case 'world':worldTap(e);break;
    case 'unfriend':unfriendModal(id);break;
    case 'quick':var q=el.getAttribute('data-q');if(q==='workout')editCheckin();else if(q==='ru')editDay(today());else if(q==='book')editMedia('reading',null,true);else if(q==='show')editMedia('screen',null,true);else editNote();break;
    case 'rf':UI.rf=el.getAttribute('data-v');keepUI();render();break;
  }
});
