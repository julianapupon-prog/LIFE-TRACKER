:root{--bg:#FFF4EC;--paper:#FFFDF9;--ink:#4A2B4F;--blue:#4A2B4F;--pink:#F7A8C4;--pinkl:#FCD9E6;--pinkd:#E86A9A;--sky:#9FD8F5;--skyl:#D6EFFA;--mint:#A8E6C1;--mintl:#DDF5E6;--butter:#FFE38A;--lav:#E2CDF2;--soft:rgba(232,106,154,.12);--line:rgba(74,43,79,.25)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Pixelify Sans',system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;background-image:linear-gradient(rgba(232,106,154,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(232,106,154,.09) 1px,transparent 1px);background-size:10px 10px}
h1,h2,h3{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;margin:0;color:var(--ink)}
h1{font-family:'Silkscreen',monospace;font-weight:700;font-size:28px;line-height:1;letter-spacing:.02em}
h2{font-size:22px}
h3{font-size:19px}
.lbl{font-family:'Silkscreen',monospace;font-weight:400;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.8}
.muted{opacity:.6}
a{color:var(--pinkd)}
button{font-family:'Pixelify Sans',system-ui,sans-serif;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:0;padding:5px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:none}
button.primary{background:var(--pink)}
button.link{border:0;padding:0 4px;box-shadow:none;background:transparent;text-decoration:underline;text-underline-offset:3px}
button.danger{border-style:dashed;box-shadow:none}
button.big{width:100%;font-weight:600;font-size:20px;padding:10px;box-shadow:3px 3px 0 var(--ink)}
input,select,textarea{font-family:'Pixelify Sans',system-ui,sans-serif;font-size:17px;color:var(--ink);background:#fff;border:2px solid var(--ink);padding:7px 8px;width:100%;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pinkd);box-shadow:2px 2px 0 var(--pink)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pinkd);margin:0;flex:none}
header{position:relative;padding:16px 16px 12px;background:var(--pink);border-bottom:3px solid var(--ink)}
header .grid{display:none}
header h1{color:#fff;text-shadow:2px 2px 0 var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative}
#status{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
nav{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;overflow-x:auto;border-bottom:3px solid var(--ink);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:1 0 auto;text-align:center;padding:10px 12px 8px;text-decoration:none;color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:500;font-size:16px;border-right:2px solid var(--ink);white-space:nowrap}
nav a:last-child{border-right:0}
nav a.on{background:var(--sky)}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--paper);border:3px solid var(--ink);padding:14px;margin:0 0 16px;box-shadow:4px 4px 0 var(--pink)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--ink);margin:0 0 16px;background:var(--paper);box-shadow:4px 4px 0 var(--sky)}
.stats>div{padding:10px 6px;text-align:center;border-right:2px solid var(--ink)}
.stats>div:nth-child(1){background:var(--pinkl)}.stats>div:nth-child(2){background:var(--skyl)}.stats>div:nth-child(3){background:var(--mintl)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:700;font-size:26px;color:var(--ink)}
.seg{display:flex;border:2px solid var(--ink);overflow:hidden;margin:0 0 16px;box-shadow:2px 2px 0 var(--ink)}
.seg button{flex:1;border:0;border-right:2px solid var(--ink);box-shadow:none;padding:7px 4px}
.seg button:active{transform:none}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sky)}
.row{display:flex;gap:10px;align-items:center}
.list>.item{padding:10px 0;border-bottom:2px dashed var(--line);cursor:pointer}
.list>.item:last-child{border-bottom:0}
.pre{white-space:pre-wrap}
.empty{text-align:center;padding:26px 10px;opacity:.65}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.media{cursor:pointer}
.cover{aspect-ratio:2/3;width:100%;border:3px solid var(--ink);overflow:hidden;background:var(--sky);display:flex;align-items:flex-end;padding:10px;color:var(--ink);box-shadow:3px 3px 0 var(--pink)}
.media:nth-child(3n+2) .cover{background:var(--pink)}.media:nth-child(3n) .cover{background:var(--mint)}
.cover img{width:calc(100% + 20px);height:calc(100% + 20px);margin:-10px;object-fit:cover;display:block}
.cover span{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.15}
.media .t{margin-top:8px;font-weight:600;font-size:17px;line-height:1.15;color:var(--ink)}
.stars{letter-spacing:2px;font-size:18px;color:var(--pinkd)}
.starsin button{border:0;box-shadow:none;background:transparent;font-size:30px;padding:0 3px;opacity:.3;color:var(--pinkd)}
.starsin button.on{opacity:1}
.tag{display:inline-block;font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--ink);padding:1px 5px;margin-right:4px;vertical-align:middle;background:#fff}
.tag.fill{background:var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chips button{font-size:15px;padding:2px 10px}
.chips button.on{background:var(--butter)}
.lnk{display:inline-block;font-size:15px;margin:4px 8px 0 0;word-break:break-all}
.bar{height:12px;border:2px solid var(--ink);overflow:hidden;margin:6px 0 2px;background:#fff}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pinkd) 0 8px,var(--pink) 8px 10px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-family:'Silkscreen',monospace;font-size:10px}
.cal button{padding:6px 0;font-size:15px;border:2px solid var(--ink);box-shadow:none;background:#fff}
.cal button.l1{background:var(--pinkl)}
.cal button.l2{background:var(--pink)}
.cal button.l3{background:var(--pinkd);color:#fff}
.cal button.tod{outline:3px solid var(--sky);outline-offset:-5px}
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.toggles button{padding:10px 4px;font-weight:600;font-size:16px;line-height:1.1}
.toggles button.on{background:var(--mint)}
details.grp{border-bottom:2px dashed var(--line)}
details.grp:last-child{border-bottom:0}
details.grp summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .n{font-family:'Silkscreen',monospace;font-size:10px;white-space:nowrap}
.topic{display:flex;gap:10px;align-items:center;padding:5px 0 5px 4px;cursor:pointer}
.topic.done span{text-decoration:line-through;opacity:.55}
.cat{margin:22px 0 6px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(74,43,79,.4);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border:3px solid var(--ink);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}.sheet{border-bottom:3px solid var(--ink);box-shadow:6px 6px 0 var(--pink)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h .x{border:0;box-shadow:none;background:transparent;font-size:30px;padding:0 6px}
.f{margin:0 0 12px}
.f>.lbl{display:block;margin-bottom:4px}
.sheet-f{display:flex;gap:8px;align-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.prev{width:90px;aspect-ratio:2/3;object-fit:cover;border:3px solid var(--ink);display:block;margin:6px 0}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
svg text{font-family:'Pixelify Sans',sans-serif;fill:var(--ink)}
/* bunny console */
.console{position:relative;background:#F7B6CF;border:3px solid var(--ink);border-radius:14px 14px 60px 14px;padding:14px 14px 26px;margin:0 auto 18px;max-width:440px;box-shadow:inset -6px -6px 0 rgba(232,106,154,.45),inset 4px 4px 0 rgba(255,255,255,.45),4px 4px 0 var(--ink)}
.bezel{position:relative;background:#5B3A66;border-radius:8px 8px 26px 8px;padding:8px 14px 16px 22px}
.led{position:absolute;left:8px;top:48%;width:6px;height:6px;background:#7CF29A;box-shadow:0 0 6px #7CF29A}
.ptag{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-family:'Silkscreen',monospace;font-size:10px;color:#FCD9E6;text-transform:uppercase}
.ptname{background:transparent;border:0;box-shadow:none;padding:0;font-family:'Silkscreen',monospace;font-size:12px;color:#fff;text-transform:uppercase}
.screen{position:relative;border:3px solid var(--ink);background:#9FD8F5;overflow:hidden}
#world{display:block;width:100%;aspect-ratio:4/3;cursor:pointer;touch-action:manipulation}
.bubble{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:4px 8px;font-family:'Silkscreen',monospace;font-size:11px;line-height:1.35;text-transform:uppercase;pointer-events:none}
.bubble:empty{display:none}
.brand{font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:rgba(74,43,79,.42);margin:10px 0 0 4px}
.controls{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 0}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);filter:drop-shadow(3px 3px 0 rgba(74,43,79,.35))}
.dpad button,.dpad .c{background:#5B3A66;border:0;box-shadow:none;padding:0;border-radius:0}
.dpad button:active{transform:none;background:#3F2648}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1;border-radius:5px 0 0 5px}.dpad .c{grid-area:2/2}.dpad .r{grid-area:2/3;border-radius:0 5px 5px 0}.dpad .d{grid-area:3/2}
.dpad .u{border-radius:5px 5px 0 0}.dpad .d{border-radius:0 0 5px 5px}
.ab{display:flex;gap:14px;transform:rotate(-22deg);margin-right:6px}
.ab>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Silkscreen',monospace;font-size:10px;text-transform:uppercase;color:rgba(74,43,79,.7)}
.ab>div:last-child{margin-top:-26px}
.ab button{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.15),2px 2px 0 var(--ink);padding:0}
.ab .ba{background:#E86A9A}.ab .bb{background:#9FD8F5}
.grille{position:absolute;right:26px;bottom:18px;width:44px;height:30px;background:repeating-linear-gradient(-55deg,transparent 0 5px,rgba(74,43,79,.35) 5px 8px);clip-path:polygon(30% 0,100% 0,100% 100%,0 100%)}
.pstat{display:flex;gap:10px;align-items:center;margin:8px 0}
.pxi{width:22px;height:22px;flex:none}
.pst{flex:1}
.pbar{height:14px;border:2px solid var(--ink);background:#fff;margin-top:3px}
.pbar i{display:block;height:100%;-webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{padding:10px 6px;font-weight:600;background:#fff}
.quick button:nth-child(1){background:var(--pinkl)}.quick button:nth-child(2){background:var(--skyl)}.quick button:nth-child(3){background:#FFF3C4}.quick button:nth-child(4){background:var(--lav)}.quick button:nth-child(5){background:var(--mintl);grid-column:1/-1}

function petStats(){
  var now=new Date();now.setHours(0,0,0,0);
  var sc={health:0,joy:0,smart:0,ideas:0},xp=0;
  function add(stat,pts,k){
    if(!k)return;var p=String(k).split('-');if(p.length<3)return;
    var age=Math.max(0,Math.round((now-new Date(+p[0],+p[1]-1,+p[2]))/864e5));
    xp+=pts;sc[stat]+=pts*Math.pow(.82,age);
  }
  S.fitness.checkins.forEach(function(c){add('health',10,c.date)});
  S.books.forEach(function(b){if(b.status==='done')add('joy',15,b.finish)});
  S.shows.forEach(function(b){if(b.status==='done')add('joy',8,b.finish)});
  Object.keys(S.ru.days).forEach(function(k){var n=dayLv(k);if(n)add('smart',4*n,k)});
  Object.keys(S.ru.done).forEach(function(id){add('smart',1,S.ru.done[id])});
  S.notes.forEach(function(n){if(n.updated)add('ideas',n.status==='published'?20:5,dkey(new Date(n.updated)))});
  var out={xp:xp,v:{}},sum=0;
  STATS.forEach(function(s){var v=Math.max(8,Math.min(100,Math.round(sc[s.k]*s.K)));out.v[s.k]=v;sum+=v;});
  out.avg=sum/STATS.length;
  var st=0;STAGES.forEach(function(x,i){if(xp>=x.xp)st=i});out.stage=st;
  out.level=1+Math.floor(xp/20);out.lvXp=xp%20;
  var low=STATS.slice().sort(function(a,b){return out.v[a.k]-out.v[b.k]})[0];out.low=low.k;
  var born=S.pet.born||today(),bd=born.split('-');
  out.newborn=(new Date()-new Date(+bd[0],+bd[1]-1,+bd[2]))<2*864e5;
  out.sad=out.avg<30&&!out.newborn;
  return out;
}

var inp=function(name,val,type,ph){return '<input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'};
var ta=function(name,val,ph,rows){return '<textarea name="'+name+'"'+(rows?' rows="'+rows+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>'};
var sel=function(name,val,opts){return '<select name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'};
var starIn=function(v){v=+v||0;var s='<input type="hidden" name="rating" value="'+v+'"><div class="starsin">';for(var i=1;i<=5;i++)s+='<button type="button" data-star="'+i+'" class="'+(i<=v?'on':'')+'">★</button>';return s+'</div>'};
function fv(name){var e=$('#mf [name="'+name+'"]');return e?e.value.trim():''}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function remove(arr,id){var i=arr.findIndex(function(x){return x.id===id});if(i>-1)arr.splice(i,1)}

function editMe(){
  var f=S.fitness;
  modal('me',fld('height',inp('height',f.height,'text','e.g. 1,65 m'))+fld('starting weight',inp('weight',f.weight,'text','e.g. 60 kg'))+fld('goal weight',inp('goalWeight',f.goalWeight,'text','optional'))+fld('my goals',ta('goals',f.goals,'what do you want from training?',4)),
  function(){f.height=fv('height');f.weight=fv('weight');f.goalWeight=fv('goalWeight');f.goals=fv('goals');save();});
}
function editPlan(id){
  var p=id?byId(S.fitness.plan,id):null;
  modal(p?'edit workout':'new workout',fld('name',inp('name',p?p.name:'','text','e.g. workout A — upper body'))+fld('exercises (one per line)',ta('items',p?p.items:'','squats 4x10\nleg press 3x12…',8)),
  function(){var n=fv('name');if(!n)return false;if(p){p.name=n;p.items=fv('items')}else S.fitness.plan.push({id:uid(),name:n,items:fv('items')});save();},
  p?function(){remove(S.fitness.plan,id);save();}:null);
}
function editCheckin(id){
  var c=id?byId(S.fitness.checkins,id):null;
  var opts=[['','—']].concat(S.fitness.plan.map(function(p){return[p.name,p.name]}));
  var w=c?c.workout:'';if(w&&!opts.some(function(o){return o[0]===w}))opts.push([w,w]);
  opts.push(['other','other / cardio / class']);
  modal(c?'edit check-in':'check in',fld('date',inp('date',c?c.date:today(),'date'))+fld('workout',sel('workout',w,opts))+fld('what i did',ta('did',c?c.did:'','exercises, loads, km, minutes…',5))+fld('weight today (optional)',inp('weight',c?c.weight:'','text','e.g. 59,5'))+fld('notes',ta('notes',c?c.notes:'','how did it feel?',2)),
  function(){var o={date:fv('date')||today(),workout:fv('workout'),did:fv('did'),weight:fv('weight'),notes:fv('notes')};if(c)Object.assign(c,o);else{o.id=uid();S.fitness.checkins.push(o);}save();},
  c?function(){remove(S.fitness.checkins,id);save();}:null);
}
var pendingCover=null;
function editMedia(t,id,forceDone){
  var M=MEDIA[t],x=id?byId(S[M.key],id):null;pendingCover=x?x.cover:'';
  var st=forceDone?'done':(x?x.status:UI[t]);
  var b='<div class="f"><span class="lbl">cover (optional)</span><div id="cvp">'+(pendingCover?'<img class="prev" src="'+esc(pendingCover)+'">':'')+'</div><div class="row"><input type="file" accept="image/*" id="cvf" style="border:0;padding:4px 0">'+(pendingCover?'<button type="button" class="link" data-m="nocover">remove</button>':'')+'</div></div>'+
   fld('title',inp('title',x?x.title:''));
  if(t==='reading') b+=fld('author',inp('author',x?x.author:''));
  else b+=fld('type',sel('kind',x?x.kind:'film',[['film','film'],['series','series'],['doc','documentary'],['other','other']]))+fld('where (optional)',inp('where',x?x.where:'','text','mubi, netflix, cinema…'));
  b+=fld('status',sel('status',st,M.st));
  b+='<div id="donef"'+(st==='done'?'':' hidden')+'>'+fld('finished on',inp('finish',x&&x.finish?x.finish:today(),'date'))+fld('rating',starIn(x?x.rating:0))+fld('review',ta('review',x?x.review:'','what stayed with you?',4))+'</div>';
  modal(x?'edit':'add '+M.noun,b,function(){
    var ti=fv('title');if(!ti)return false;
    var o={title:ti,status:fv('status'),cover:pendingCover||''};
    if(t==='reading')o.author=fv('author');else{o.kind=fv('kind');o.where=fv('where');}
    if(o.status==='done'){o.finish=fv('finish')||today();o.rating=+fv('rating')||0;o.review=fv('review');}
    if(x)Object.assign(x,o);else{o.id=uid();o.added=today();S[M.key].push(o);}
    UI[t]=o.status;keepUI();save();
  },x?function(){remove(S[M.key],id);save();}:null);
  $('#cvf').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;$('#cvp').innerHTML='<div class="lbl">uploading…</div>';
    processImage(file).then(function(u){pendingCover=u;$('#cvp').innerHTML='<img class="prev" src="'+esc(u)+'">'}).catch(function(){$('#cvp').innerHTML='<div class="lbl">couldn\'t read that image</div>'})});
  $('#mf [name=status]').addEventListener('change',function(e){$('#donef').hidden=e.target.value!=='done'});
}
function editNote(id){
  var n=id?byId(S.notes,id):null;
  modal(n?'edit note':'new note',fld('title',inp('title',n?n.title:'','text','essay idea'))+fld('status',sel('status',n?n.status:'idea',NST))+fld('notes',ta('body',n?n.body:'','thoughts, quotes, structure…',9))+fld('links & references — one per line (label | url)',ta('links',n?n.links:'','the review i liked | https://…',4))+fld('tags (comma separated)',inp('tags',n?n.tags:'','film, books, art…')),
  function(){var o={title:fv('title'),status:fv('status'),body:fv('body'),links:fv('links'),tags:fv('tags'),updated:Date.now()};if(!o.title&&!o.body)return false;if(n)Object.assign(n,o);else{o.id=uid();o.created=Date.now();S.notes.push(o);}save();},
  n?function(){remove(S.notes,id);save();}:null);
}
function editDay(k){
  var d=S.ru.days[k]||{};
  modal(fmt(k),[['s','studied'],['r','read a text'],['v','watched a video']].map(function(x){return '<label class="chk"><input type="checkbox" name="'+x[0]+'"'+(d[x[0]]?' checked':'')+'><span>'+x[1]+'</span></label>'}).join('')+fld('note (optional)',ta('note',d.note||'','what did you study?',3)),
  function(){var o={s:$('#mf [name=s]').checked,r:$('#mf [name=r]').checked,v:$('#mf [name=v]').checked,note:fv('note')};if(!o.s&&!o.r&&!o.v&&!o.note)delete S.ru.days[k];else S.ru.days[k]=o;save();});
}
function editGoal(t){
  var M=MEDIA[t];
  modal('goal for this year',fld(M.key==='books'?'books':'movies & shows',inp('g',S.goals[M.goal],'number')),function(){var g=parseInt(fv('g'),10);if(g>0){S.goals[M.goal]=g;save();}});
}

/* ---------- backup ---------- */
var LB='lifelog-lastbackup';
function summary(o){
  var f=o.fitness||{},n=function(a){return (a||[]).length},ru=o.ru||{};
  var parts=[[n(f.checkins),'check-in','check-ins'],[n(f.plan),'workout','workouts'],[n(o.books),'book','books'],[n(o.shows),'film or show','films & shows'],[n(o.notes),'note','notes'],[Object.keys(ru.days||{}).length,'russian day','russian days'],[Object.keys(ru.done||{}).length,'topic','topics']];
  return parts.map(function(p){return p[0]+' '+(p[0]===1?p[1]:p[2])}).join(' · ');
}
function backupSheet(){
  var last=null;try{last=localStorage.getItem(LB)}catch(e){}
  modal('backup',
    '<p style="margin:0 0 12px">Everything is saved in this browser only. Download a backup now and then, and use it to move your data to another device.</p>'+
    '<div class="f"><span class="lbl">on this device</span><div>'+summary(S)+'</div></div>'+
    '<div class="f"><span class="lbl">last backup</span><div>'+(last?fmt(last):'never')+'</div></div>'+
    '<button type="button" class="primary big" data-act="export">download backup</button><div style="height:10px"></div>'+
    '<label class="big" style="display:block;text-align:center;border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);padding:10px;font-weight:600;font-size:20px;cursor:pointer">load a backup<input type="file" id="impf" accept="application/json,.json" hidden></label>',
    null,null,true);
  $('#impf').addEventListener('change',function(e){var file=e.target.files[0];if(file)readBackup(file);});
}
function exportData(){
  var name='lifelog-'+today()+'.json',json=JSON.stringify(S,null,2);
  var done=function(){try{localStorage.setItem(LB,today())}catch(e){}closeModal();render();};
  var file=null;try{file=new File([json],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){
    navigator.share({files:[file],title:name}).then(done).catch(function(){});return;
  }
  var url=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
  done();
}
function readBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result)}catch(e){o=null}
    if(!o||typeof o!=='object'||!('fitness' in o||'books' in o||'ru' in o)){alert("That file isn't a life log backup.");return;}
    var when=o.updated?fmt(dkey(new Date(o.updated))):'unknown date';
    closeModal();
    modal('load backup?',
      '<div class="f"><span class="lbl">backup from '+esc(when)+'</span><div>'+summary(o)+'</div></div>'+
      '<div class="f"><span class="lbl">on this device now</span><div>'+summary(S)+'</div></div>'+
      '<p style="margin:0">This replaces everything on this device with the backup. Download a backup first if you want to keep what\'s here.</p>',
      function(){S=norm(o);save();});
    var b=$('#mf [type=submit]');if(b)b.textContent='replace';
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){var a=m.getAttribute('data-m');
    if(a==='close'){closeModal();render();return;}
    if(a==='del'){if(!delArm){delArm=true;m.textContent='tap again to delete';return;}var f=MDEL;closeModal();if(f)f();render();return;}
    if(a==='nocover'){pendingCover='';$('#cvp').innerHTML='';m.remove();return;}
  }
  var st=e.target.closest('[data-star]');
  if(st){var v=+st.getAttribute('data-star'),hid=$('#mf [name=rating]');if(+hid.value===v)v=0;hid.value=v;document.querySelectorAll('[data-star]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-star')<=v)});return;}
  if(e.target.id==='modal'){closeModal();render();return;}
  if(e.target.closest('a.lnk')){e.stopPropagation();return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),t=el.getAttribute('data-t');
  switch(act){
    case 'editMe':editMe();break;
    case 'checkin':editCheckin();break;
    case 'editCheckin':editCheckin(id);break;
    case 'addPlan':editPlan();break;
    case 'editPlan':editPlan(id);break;
    case 'seg':UI[t]=el.getAttribute('data-v');keepUI();render();break;
    case 'addMedia':editMedia(t);break;
    case 'editMedia':editMedia(t,id);break;
    case 'finishMedia':e.stopPropagation();editMedia(t,id,true);break;
    case 'goal':editGoal(t);break;
    case 'nf':UI.nf=el.getAttribute('data-v');keepUI();render();break;
    case 'addNote':editNote();break;
    case 'editNote':editNote(id);break;
    case 'ruT':var k=today(),d=S.ru.days[k]||(S.ru.days[k]={}),kk=el.getAttribute('data-k');d[kk]=!d[kk];save();render();break;
    case 'ruDay':editDay(el.getAttribute('data-d'));break;
    case 'cal':UI.cm+=+el.getAttribute('data-d');if(UI.cm<0){UI.cm=11;UI.cy--;}if(UI.cm>11){UI.cm=0;UI.cy++;}keepUI();render();break;
    case 'backup':backupSheet();break;
    case 'export':exportData();break;
    case 'pet-l':case 'pet-r':case 'pet-u':case 'pet-d':case 'pet-a':case 'pet-b':petAct(act);break;
    case 'petName':nameModal();break;
    case 'quick':var q=el.getAttribute('data-q');if(q==='workout')editCheckin();else if(q==='ru')editDay(today());else if(q==='book')editMedia('reading',null,true);else if(q==='show')editMedia('screen',null,true);else editNote();break;
    case 'rf':UI.rf=el.getAttribute('data-v');keepUI();render();break;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='mf')return;e.preventDefault();
  var f=MSAVE;if(f&&f()===false)return;closeModal();render();
});
document.addEventListener('change',function(e){
  var tid=e.target.getAttribute&&e.target.getAttribute('data-topic');
  if(tid){if(e.target.checked)S.ru.done[tid]=today();else delete S.ru.done[tid];save();var y=window.scrollY;render();window.scrollTo(0,y);}
});
document.addEventListener('toggle',function(e){var g=e.target.getAttribute&&e.target.getAttribute('data-g');if(g!=null){if(e.target.open)UI.open[g]=1;else delete UI.open[g];keepUI();}},true);
document.addEventListener('input',function(e){if(e.target.id==='nq'){UI.q=e.target.value;keepUI();var pos=e.target.selectionStart;render();var n=$('#nq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener('focusout',function(){if(dirty)schedule();});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

render();
try{var sy=sessionStorage.getItem('ll-scroll');if(sy){sessionStorage.removeItem('ll-scroll');setTimeout(function(){window.scrollTo(0,+sy)},60);}}catch(e){}
})();
</script></body></html>
