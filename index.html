<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Log</title><meta name="theme-color" content="#EBE4D1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="life log"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nothing+You+Could+Do&family=Cormorant+Garamond:wght@500;600&display=swap"><style id="css">
:root{--bg:#EBE4D1;--paper:#F4EFE1;--blue:#1F3FBF;--ink:#132a85;--soft:rgba(31,63,191,.12);--line:rgba(31,63,191,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--blue)}
body{font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Nothing You Could Do',cursive;font-weight:400;margin:0;color:var(--ink)}
h1{font-size:38px;line-height:1}
h2{font-size:25px}
h3{font-size:23px}
.lbl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.muted{opacity:.6}
a{color:var(--blue)}
button{font-family:'EB Garamond',Georgia,serif;font-size:16px;color:var(--blue);background:transparent;border:1.5px solid var(--blue);border-radius:3px;padding:4px 12px;cursor:pointer}
button.primary{background:var(--blue);color:var(--bg)}
button.link{border:0;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
button.danger{border-style:dashed}
button.big{width:100%;font-family:'Nothing You Could Do',cursive;font-size:22px;padding:10px}
input,select,textarea{font-family:'EB Garamond',Georgia,serif;font-size:17px;color:var(--ink);background:var(--paper);border:0;border-bottom:1.5px solid var(--line);padding:6px 4px;width:100%;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--blue)}
textarea{min-height:90px;resize:vertical;border:1.5px solid var(--line);border-radius:3px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);margin:0;flex:none}
header{position:relative;padding:22px 18px 10px;border-bottom:1.5px solid var(--blue)}
header .grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--line),var(--line)) 0 64%/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 72% 0/1px 100% no-repeat;opacity:.6}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative}
#status{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;overflow-x:auto;border-bottom:1.5px solid var(--blue);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:1 0 auto;text-align:center;padding:10px 14px 8px;text-decoration:none;font-family:'Nothing You Could Do',cursive;font-size:19px;border-right:1px solid var(--line);white-space:nowrap}
nav a:last-child{border-right:0}
nav a.on{background:var(--blue);color:var(--bg)}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--paper);border:1.5px solid var(--blue);border-radius:3px;padding:14px;margin:0 0 14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--blue);border-radius:3px;margin:0 0 14px;background:var(--paper)}
.stats>div{padding:10px 8px;text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-family:'Nothing You Could Do',cursive;font-weight:400;font-size:26px;color:var(--ink)}
.seg{display:flex;border:1.5px solid var(--blue);border-radius:3px;overflow:hidden;margin:0 0 14px}
.seg button{flex:1;border:0;border-right:1px solid var(--line);border-radius:0;padding:7px 4px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center}
.list>.item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list>.item:last-child{border-bottom:0}
.pre{white-space:pre-wrap}
.empty{text-align:center;padding:26px 10px;opacity:.65}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.media{cursor:pointer}
.cover{aspect-ratio:2/3;width:100%;border:1.5px solid var(--blue);border-radius:3px;overflow:hidden;background:var(--blue);display:flex;align-items:flex-end;padding:10px;color:var(--bg)}
.cover img{width:calc(100% + 20px);height:calc(100% + 20px);margin:-10px;object-fit:cover;display:block}
.cover span{font-family:'Nothing You Could Do',cursive;font-size:19px;line-height:1.15}
.media .t{margin-top:6px;font-family:'Nothing You Could Do',cursive;font-size:18px;line-height:1.15;color:var(--ink)}
.stars{letter-spacing:2px;font-size:18px}
.starsin button{border:0;font-size:30px;padding:0 3px;opacity:.3}
.starsin button.on{opacity:1}
.tag{display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--blue);border-radius:2px;padding:1px 5px;margin-right:4px;vertical-align:middle}
.tag.fill{background:var(--blue);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{font-size:15px;padding:2px 10px}
.chips button.on{background:var(--blue);color:var(--bg)}
.lnk{display:inline-block;font-size:15px;margin:4px 8px 0 0;word-break:break-all}
.bar{height:8px;border:1px solid var(--blue);border-radius:2px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;letter-spacing:.1em}
.cal button{padding:6px 0;font-size:15px;border:1px solid var(--line)}
.cal button.l1{background:rgba(31,63,191,.25)}
.cal button.l2{background:rgba(31,63,191,.55);color:var(--bg)}
.cal button.l3{background:var(--blue);color:var(--bg)}
.cal button.tod{border:2px solid var(--blue)}
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toggles button{padding:10px 4px;font-family:'Nothing You Could Do',cursive;font-size:17px;line-height:1.1}
.toggles button.on{background:var(--blue);color:var(--bg)}
details.grp{border-bottom:1px solid var(--line)}
details.grp summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .n{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.topic{display:flex;gap:10px;align-items:center;padding:5px 0 5px 4px;cursor:pointer}
.topic.done span{text-decoration:line-through;opacity:.55}
.cat{margin:20px 0 4px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,30,90,.35);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border:1.5px solid var(--blue);border-bottom:0;border-radius:6px 6px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:6px;border-bottom:1.5px solid var(--blue)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h .x{border:0;font-size:30px;padding:0 6px}
.f{margin:0 0 12px}
.f>.lbl{display:block;margin-bottom:2px}
.sheet-f{display:flex;gap:8px;align-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.prev{width:90px;aspect-ratio:2/3;object-fit:cover;border:1.5px solid var(--blue);border-radius:3px;display:block;margin:6px 0}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
svg text{font-family:'EB Garamond',serif;fill:var(--blue)}

  h+='<div class="stats"><div><span class="lbl">last 7 days</span><b>'+nW+'</b></div><div><span class="lbl">this month</span><b>'+nM+'</b></div><div><span class="lbl">total</span><b>'+ci.length+'</b></div></div>';
  var pts=f.checkins.filter(function(c){return c.weight&&!isNaN(parseFloat(String(c.weight).replace(',','.')))}).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(pts.length>=2) h+='<section class="card"><h2>weight</h2>'+chart(pts)+'</section>';
  h+='<section class="card"><div class="card-h"><h2>training plan</h2><button class="link" data-act="addPlan">+ add</button></div>'+

  h+='<section class="card"><h2>check-ins</h2>'+(ci.length?'<div class="list">'+ci.map(function(c){return '<div class="item" data-act="editCheckin" data-id="'+c.id+'"><div class="row" style="justify-content:space-between"><span class="lbl">'+fmt(c.date)+'</span>'+(c.weight?'<span class="tag">'+esc(c.weight)+'</span>':'')+'</div><h3>'+(esc(c.workout)||'workout')+'</h3>'+(c.did?'<div class="pre">'+esc(c.did)+'</div>':'')+(c.notes?'<div class="pre muted">'+esc(c.notes)+'</div>':'')+'</div>'}).join('')+'</div>':'<div class="empty">no check-ins yet</div>')+'</section>';

function chart(pts){
  var v=pts.map(function(p){return parseFloat(String(p.weight).replace(',','.'))});
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);if(mx===mn){mx+=1;mn-=1;}
  var W=320,H=120,P=22;
  var xy=v.map(function(y,i){return[P+(W-2*P)*i/(v.length-1),P/2+(H-P*1.5)*(1-(y-mn)/(mx-mn))]});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><polyline fill="none" stroke="#1F3FBF" stroke-width="2" stroke-linejoin="round" points="'+xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'+xy.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#1F3FBF"/>'}).join('')+
  '<text x="'+P+'" y="'+(H-2)+'" font-size="12">'+fmt(pts[0].date)+'</text><text x="'+(W-P)+'" y="'+(H-2)+'" font-size="15" text-anchor="end">'+fmt(pts[pts.length-1].date)+'</text><text x="2" y="14" font-size="12">'+mx+'</text></svg>';
}

    (n.body?'<div class="pre" style="max-height:5.2em;overflow:hidden">'+esc(n.body)+'</div>':'')+
    (links.length?'<div>'+links.map(function(l){return '<a class="lnk" href="'+esc(l.url)+'" target="_blank" rel="noopener">↗ '+esc(l.label)+'</a>'}).join('')+'</div>':'')+
    (n.tags?'<div style="margin-top:6px">'+n.tags.split(',').map(function(x){x=x.trim();return x?'<span class="tag">'+esc(x)+'</span>':''}).join('')+'</div>':'')+'</section>';
  }).join('');
}
function parseLinks(s){
  return String(s||'').split('\n').map(function(l){l=l.trim();if(!l)return null;var p=l.split('|');var url=(p.length>1?p[1]:p[0]).trim(),label=(p.length>1?p[0]:p[0]).trim();
    if(!/^https?:\/\//i.test(url)){ if(/^[\w.-]+\.[a-z]{2,}/i.test(url)) url='https://'+url; else return {url:'#',label:label,bad:1}; }
    if(p.length<2) label=label.replace(/^https?:\/\/(www\.)?/i,'').slice(0,40);
    return {url:url,label:label};}).filter(function(x){return x&&!x.bad});
}

  modal(p?'edit workout':'new workout',fld('name',inp('name',p?p.name:'','text','e.g. workout A — upper body'))+fld('exercises (one per line)',ta('items',p?p.items:'','squats 4x10\nleg press 3x12…',8)),
  function(){var n=fv('name');if(!n)return false;if(p){p.name=n;p.items=fv('items')}else S.fitness.plan.push({id:uid(),name:n,items:fv('items')});save();},
  p?function(){remove(S.fitness.plan,id);save();}:null);
}
function editCheckin(id){
  var c=id?byId(S.fitness.checkins,id):null;
  var opts=[['','—']].concat(S.fitness.plan.map(function(p){return[p.name,p.name]}));
  var w=c?c.workout:'';if(w&&!opts.some(function(o){return o[0]===w}))opts.push([w,w]);
  opts.push(['other','other / cardio / class']);
  modal(c?'edit check-in':'check in',fld('date',inp('date',c?c.date:today(),'date'))+fld('workout',sel('workout',w,opts))+fld('what i did',ta('did',c?c.did:'','exercises, loads, km, minutes…',5))+fld('weight today (optional)',inp('weight',c?c.weight:'','text','e.g. 59,5'))+fld('notes',ta('notes',c?c.notes:'','how did it feel?',2)),
  function(){var o={date:fv('date')||today(),workout:fv('workout'),did:fv('did'),weight:fv('weight'),notes:fv('notes')};if(c)Object.assign(c,o);else{o.id=uid();S.fitness.checkins.push(o);}save();},
  c?function(){remove(S.fitness.checkins,id);save();}:null);
}
var pendingCover=null;
function editMedia(t,id,forceDone){
  var M=MEDIA[t],x=id?byId(S[M.key],id):null;pendingCover=x?x.cover:'';
  var st=forceDone?'done':(x?x.status:UI[t]);
  var b='<div class="f"><span class="lbl">cover (optional)</span><div id="cvp">'+(pendingCover?'<img class="prev" src="'+esc(pendingCover)+'">':'')+'</div><div class="row"><input type="file" accept="image/*" id="cvf" style="border:0;padding:4px 0">'+(pendingCover?'<button type="button" class="link" data-m="nocover">remove</button>':'')+'</div></div>'+
   fld('title',inp('title',x?x.title:''));
  if(t==='reading') b+=fld('author',inp('author',x?x.author:''));
  else b+=fld('type',sel('kind',x?x.kind:'film',[['film','film'],['series','series'],['doc','documentary'],['other','other']]))+fld('where (optional)',inp('where',x?x.where:'','text','mubi, netflix, cinema…'));
  b+=fld('status',sel('status',st,M.st));
  b+='<div id="donef"'+(st==='done'?'':' hidden')+'>'+fld('finished on',inp('finish',x&&x.finish?x.finish:today(),'date'))+fld('rating',starIn(x?x.rating:0))+fld('review',ta('review',x?x.review:'','what stayed with you?',4))+'</div>';
  modal(x?'edit':'add '+M.noun,b,function(){
    var ti=fv('title');if(!ti)return false;
    var o={title:ti,status:fv('status'),cover:pendingCover||''};
    if(t==='reading')o.author=fv('author');else{o.kind=fv('kind');o.where=fv('where');}
    if(o.status==='done'){o.finish=fv('finish')||today();o.rating=+fv('rating')||0;o.review=fv('review');}
    if(x)Object.assign(x,o);else{o.id=uid();o.added=today();S[M.key].push(o);}
    UI[t]=o.status;keepUI();save();
  },x?function(){remove(S[M.key],id);save();}:null);
  $('#cvf').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;$('#cvp').innerHTML='<div class="lbl">uploading…</div>';
    processImage(file).then(function(u){pendingCover=u;$('#cvp').innerHTML='<img class="prev" src="'+esc(u)+'">'}).catch(function(){$('#cvp').innerHTML='<div class="lbl">couldn\'t read that image</div>'})});
  $('#mf [name=status]').addEventListener('change',function(e){$('#donef').hidden=e.target.value!=='done'});
}
function editNote(id){
  var n=id?byId(S.notes,id):null;
  modal(n?'edit note':'new note',fld('title',inp('title',n?n.title:'','text','essay idea'))+fld('status',sel('status',n?n.status:'idea',NST))+fld('notes',ta('body',n?n.body:'','thoughts, quotes, structure…',9))+fld('links & references — one per line (label | url)',ta('links',n?n.links:'','the review i liked | https://…',4))+fld('tags (comma separated)',inp('tags',n?n.tags:'','film, books, art…')),
  function(){var o={title:fv('title'),status:fv('status'),body:fv('body'),links:fv('links'),tags:fv('tags'),updated:Date.now()};if(!o.title&&!o.body)return false;if(n)Object.assign(n,o);else{o.id=uid();o.created=Date.now();S.notes.push(o);}save();},
  n?function(){remove(S.notes,id);save();}:null);
}
function editDay(k){
  var d=S.ru.days[k]||{};
  modal(fmt(k),[['s','studied'],['r','read a text'],['v','watched a video']].map(function(x){return '<label class="chk"><input type="checkbox" name="'+x[0]+'"'+(d[x[0]]?' checked':'')+'><span>'+x[1]+'</span></label>'}).join('')+fld('note (optional)',ta('note',d.note||'','what did you study?',3)),
  function(){var o={s:$('#mf [name=s]').checked,r:$('#mf [name=r]').checked,v:$('#mf [name=v]').checked,note:fv('note')};if(!o.s&&!o.r&&!o.v&&!o.note)delete S.ru.days[k];else S.ru.days[k]=o;save();});
}
function editGoal(t){
  var M=MEDIA[t];
  modal('goal for this year',fld(M.key==='books'?'books':'movies & shows',inp('g',S.goals[M.goal],'number')),function(){var g=parseInt(fv('g'),10);if(g>0){S.goals[M.goal]=g;save();}});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){var a=m.getAttribute('data-m');
    if(a==='close'){closeModal();render();return;}
    if(a==='del'){if(!delArm){delArm=true;m.textContent='tap again to delete';return;}var f=MDEL;closeModal();if(f)f();render();return;}
    if(a==='nocover'){pendingCover='';$('#cvp').innerHTML='';m.remove();return;}
  }
  var st=e.target.closest('[data-star]');
  if(st){var v=+st.getAttribute('data-star'),hid=$('#mf [name=rating]');if(+hid.value===v)v=0;hid.value=v;document.querySelectorAll('[data-star]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-star')<=v)});return;}
  if(e.target.id==='modal'){closeModal();render();return;}
  if(e.target.closest('a.lnk')){e.stopPropagation();return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),t=el.getAttribute('data-t');
  switch(act){
    case 'editMe':editMe();break;
    case 'checkin':editCheckin();break;
    case 'editCheckin':editCheckin(id);break;
    case 'addPlan':editPlan();break;
    case 'editPlan':editPlan(id);break;
    case 'seg':UI[t]=el.getAttribute('data-v');keepUI();render();break;
    case 'addMedia':editMedia(t);break;
    case 'editMedia':editMedia(t,id);break;
    case 'finishMedia':e.stopPropagation();editMedia(t,id,true);break;
    case 'goal':editGoal(t);break;
    case 'nf':UI.nf=el.getAttribute('data-v');keepUI();render();break;
    case 'addNote':editNote();break;
    case 'editNote':editNote(id);break;
    case 'ruT':var k=today(),d=S.ru.days[k]||(S.ru.days[k]={}),kk=el.getAttribute('data-k');d[kk]=!d[kk];save();render();break;
    case 'ruDay':editDay(el.getAttribute('data-d'));break;
    case 'cal':UI.cm+=+el.getAttribute('data-d');if(UI.cm<0){UI.cm=11;UI.cy--;}if(UI.cm>11){UI.cm=0;UI.cy++;}keepUI();render();break;
    case 'rf':UI.rf=el.getAttribute('data-v');keepUI();render();break;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='mf')return;e.preventDefault();
  var f=MSAVE;if(f&&f()===false)return;closeModal();render();
});
document.addEventListener('change',function(e){
  var tid=e.target.getAttribute&&e.target.getAttribute('data-topic');
  if(tid){if(e.target.checked)S.ru.done[tid]=today();else delete S.ru.done[tid];save();var y=window.scrollY;render();window.scrollTo(0,y);}
});
document.addEventListener('toggle',function(e){var g=e.target.getAttribute&&e.target.getAttribute('data-g');if(g!=null){if(e.target.open)UI.open[g]=1;else delete UI.open[g];keepUI();}},true);
document.addEventListener('input',function(e){if(e.target.id==='nq'){UI.q=e.target.value;keepUI();var pos=e.target.selectionStart;render();var n=$('#nq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener('focusout',function(){if(dirty)schedule();});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

render();
try{var sy=sessionStorage.getItem('ll-scroll');if(sy){sessionStorage.removeItem('ll-scroll');setTimeout(function(){window.scrollTo(0,+sy)},60);}}catch(e){}
})();
</script></body></html>
